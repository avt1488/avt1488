function genSlots(seed) {
  const base = new Date('2026-05-15'), slots = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(base);
    d.setDate(d.getDate() + ((seed * 3 + i * 2) % 30));
    d.setHours([9,10,11,14,15,16][(seed + i) % 6], 0, 0, 0);
    slots.push({ id:`${seed}-${i}`, datetime: new Date(d), spots: Math.max(1,((seed*7+i*3)%6)+1) });
  }
  return slots.sort((a,b) => a.datetime - b.datetime);
}

function updateNav() {
  const r = route();
  document.querySelectorAll('.nav-link').forEach(el => {
    el.classList.remove('bg-purple-100','text-purple-700');
    el.classList.add('text-gray-500','hover:bg-gray-100','hover:text-gray-800');
  });
  const active = id => {
    const el = document.getElementById(id);
    el.classList.add('bg-purple-100','text-purple-700');
    el.classList.remove('text-gray-500','hover:bg-gray-100','hover:text-gray-800');
  };
  if (r==='/'||r==='')       active('nav-home');
  else if (r.startsWith('/stories')) active('nav-stories');
  else if (r==='/my-bookings')       active('nav-bookings');

  const badge = document.getElementById('bk-badge');
  if (bookings.length > 0) { badge.textContent = bookings.length; badge.style.display='flex'; }
  else badge.style.display='none';
}

function render() {
  loadBk(); updateNav();

// ─── STORIES PAGE ─────────────────────────────────────────────────────────────
function filteredStories() {
  return STORIES.filter(s => {
    if (sf.lang!=='all' && s.language!==sf.lang) return false;
    if (sf.age!=='all') {
      const [mn,mx]=sf.age.split('-').map(Number), [sn,sx]=s.ageRange.split('–').map(Number);
      if (sx<mn||sn>mx) return false;
    }
    if (sf.q) { const q=sf.q.toLowerCase(); if (!s.title.toLowerCase().includes(q)&&!(s.titleZh||'').includes(q)&&!s.description.toLowerCase().includes(q)) return false; }
    return true;
  });
}

          ${AGE_F.map(f=>`<button data-age="${f.v}" class="af-btn px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${sf.age===f.v?'bg-pink-500 text-white border-pink-500':'bg-white text-gray-600 border-gray-200'}">${f.l}</button>`).join('')}

    </div>

}

function storiesGrid(list) {
  if (!list.length) return `<div class="text-center py-20"><div class="text-6xl mb-4">🔍</div><p class="text-gray-500 text-lg">No stories match your filters.</p><button onclick="clearSF()" class="mt-4 text-purple-600 font-bold hover:underline">Clear all filters</button></div>`;
  return `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 a-fadein">${list.map(storyCard).join('')}</div>`;
}

function clearSF() { sf={lang:'all',age:'all',q:''}; document.getElementById('s-search').value=''; rebuildSF(); refreshGrid(); }

function rebuildSF() {
  document.getElementById('lang-bar').innerHTML = LANG_F.map(f=>`<button data-lang="${f.v}" class="lf-btn px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${sf.lang===f.v?'bg-purple-600 text-white border-purple-600':'bg-white text-gray-600 border-gray-200'}">${f.l}</button>`).join('');
  document.getElementById('age-bar').innerHTML  = AGE_F.map(f=>`<button data-age="${f.v}" class="af-btn px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${sf.age===f.v?'bg-pink-500 text-white border-pink-500':'bg-white text-gray-600 border-gray-200'}">${f.l}</button>`).join('');
  bindFilterBtns();
}

function refreshGrid() { document.getElementById('s-grid').innerHTML = storiesGrid(filteredStories()); }

function bindFilterBtns() {
  document.querySelectorAll('.lf-btn').forEach(b=>b.addEventListener('click',()=>{sf.lang=b.dataset.lang;rebuildSF();refreshGrid();}));
  document.querySelectorAll('.af-btn').forEach(b=>b.addEventListener('click',()=>{sf.age=b.dataset.age;rebuildSF();refreshGrid();}));
}

function bindStories() {
  document.getElementById('s-search').addEventListener('input',e=>{sf.q=e.target.value;refreshGrid();});
  bindFilterBtns();
}

// booking flow handlers
function goStep(step) {
  if (bs.step===2) saveFormToState();
  bs.step=step;
  document.getElementById('main').innerHTML=pageDetail();
  window.scrollTo(0,0);
}

function saveFormToState() {
  ['parentName','childName','childAge','email','phone','note'].forEach(k=>{
    const el=document.getElementById('f-'+k); if(el) bs.form[k]=el.value;
  });
}

function pickSlot(id) {
  const story=STORIES.find(s=>s.id===bs.storyId);
  bs.slot=story.slots.find(s=>s.id===id)||null;
  const grid=document.getElementById('slot-grid');
  if(grid) grid.innerHTML=slotsHTML(story.slots.filter(s=>s.spots>0));
  const btn=document.getElementById('cont-btn');
  if(btn){ btn.disabled=!bs.slot; btn.className=btn.className.replace('opacity-40 cursor-not-allowed','').trim()+(bs.slot?'':' opacity-40 cursor-not-allowed'); }
}

function submitForm() {
  saveFormToState();
  const f=bs.form, errs={};
  if(!f.parentName.trim()) errs.parentName='Required';
  if(!f.childName.trim())  errs.childName='Required';
  if(!f.email.trim()||!f.email.includes('@')) errs.email='Valid email required';
  if(!f.childAge) errs.childAge='Required';
  bs.errors=errs;
  goStep(Object.keys(errs).length===0 ? 3 : 2);
}

function confirmBk() {
  const story=STORIES.find(s=>s.id===bs.storyId);
  bookings.push({
    id: Date.now().toString(),
    story: {id:story.id,title:story.title,titleZh:story.titleZh,emoji:story.emoji,bg:story.bg,border:story.border,badge:story.badge,languageLabel:story.languageLabel,price:story.price,duration:story.duration},
    slot:  {id:bs.slot.id, datetime:bs.slot.datetime.toISOString(), spots:bs.slot.spots},
    child: {...bs.form},
  });
  saveBk(); updateNav(); bs.step=4;
  document.getElementById('main').innerHTML=pageDetail();
  window.scrollTo(0,0);
}
